# Релиз поставки: собранный shef.leadfinish.zip на постоянной ссылке. Артефакт
# прогона CI живёт 14 дней, релиз — всегда, поэтому «что именно стоит на
# портале» можно проверить и через полгода.
#
# Два входа, дальше всё общее:
#
#   git tag v1.3.0 && git push origin v1.3.0     с рабочей машины
#   Actions → Release → Run workflow              кнопкой, тег поставит сам
#
# Ручной запуск выводит тег из VERSION внутри модуля, поэтому разойтись они не
# могут в принципе. Пуш тега руками — наоборот, сверяется с VERSION.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Нужно на создание релиза, больше ничего.
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история и теги — для списка изменений с прошлого релиза.
          fetch-depth: 0

      # Тег и VERSION внутри модуля должны совпадать: иначе на портал уедет
      # архив, версия которого врёт, а версия — единственный способ понять,
      # что там стоит. Пуш тега — сверяем, ручной запуск — выводим тег из
      # VERSION, тогда расходиться нечему.
      - name: Определить тег релиза
        id: release
        run: |
          version="$(./build.sh --version)"
          echo "версия модуля: $version"

          if [ "$GITHUB_EVENT_NAME" = 'push' ]
          then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]
            then
              echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с VERSION=${version} в install/version.php"
              echo "::error::Либо поднимите VERSION, либо поставьте тег v${version}"
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          else
            # Релиз собирается из основной ветки: тег на ветке с недоведённой
            # работой потом не отличить от настоящего.
            if [ "$GITHUB_REF_NAME" != 'main' ]
            then
              echo "::error::Ручной релиз запускается только из main, а запущен из ${GITHUB_REF_NAME}"
              exit 1
            fi
            tag="v${version}"
          fi

          echo "тег релиза: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Те же проверки, что и в CI, плюс сборка архива.
      - name: Собрать shef.leadfinish.zip
        run: ./build.sh

      # Только для ручного запуска: пушем тега релиз уже помечен. Ставим уже
      # после сборки — упавшая сборка не должна оставлять тег без релиза.
      - name: Поставить тег
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1
          then
            echo "::error::Тег ${TAG} уже существует — поднимите VERSION в install/version.php"
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Релиз ${TAG#v}"
          git push origin "$TAG"

      # Мержим через Squash and Merge, поэтому каждый коммит в main — это PR,
      # и список коммитов уже читается как changelog.
      - name: Собрать описание релиза
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            echo '## Что изменилось'
            echo
            if [ -n "$previous" ]
            then
              git log --no-merges --pretty=format:'- %s' "${previous}..${TAG}"
              echo
            else
              echo "- первый релиз"
            fi
            echo
            echo '## Установка'
            echo
            echo 'Распаковать в `/home/bitrix/www/local/modules/`, поставить через'
            echo '**Marketplace → Установленные решения**. Подробности и обновление уже'
            echo 'стоящего модуля — в `docs/build-and-install.md`.'
            if [ -n "$previous" ]
            then
              echo
              echo "Предыдущий релиз: ${previous}."
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Выложить релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" shef.leadfinish.zip \
            --title "$TAG" \
            --notes-file release-notes.md

      # Packagist сам про новый тег не узнает: он перечитывает репозиторий либо
      # по хуку, либо по кнопке Update на странице пакета. Без этого composer
      # ещё сутки будет ставить прошлую версию, а на странице висит красная
      # плашка «This package is not auto-updated».
      #
      # Дёргаем его API сами — это ровно то, что делает кнопка Update.
      # Нужны два секрета (Settings → Secrets and variables → Actions):
      #
      #   PACKAGIST_USERNAME — логин на packagist.org
      #   PACKAGIST_TOKEN    — API-токен оттуда же, packagist.org/profile/
      #
      # ⚠ Секретов нет — шаг пропускается, и релиз от этого НЕ падает. Так и
      # задумано: невыложенный релиз чинить нечем, а отставший Packagist
      # догоняется кнопкой за десять секунд. Порядок тоже намеренный — сначала
      # релиз, потом Packagist: он читает теги из GitHub, и звать его раньше
      # значит звать впустую.
      - name: Обновить пакет на Packagist
        if: env.PACKAGIST_USERNAME != '' && env.PACKAGIST_TOKEN != ''
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          code="$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"repository\":{\"url\":\"https://github.com/${GITHUB_REPOSITORY}\"}}" \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}")"

          cat response.json
          echo

          if [ "$code" != '200' ]
          then
            echo "::warning::Packagist ответил ${code} — обнови пакет кнопкой Update на packagist.org"
            exit 0
          fi

          echo "Packagist принял запрос на обновление"
