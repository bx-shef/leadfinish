# Пункты 2 и 3 чек-листа перед мержем (CONTRIBUTING.md) — машинно.
# Гоняет ровно то же, что и локальный ./build.sh, чтобы CI и рабочее место
# не расходились.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Новый пуш в ветку отменяет предыдущий прогон: зелёным считается последний.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Диапазон PHP, который встречается на порталах BitrixVM. Модуль должен
        # парситься на любом из них: какой стоит у заказчика — знает заказчик.
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Поставить PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # node предустановлен на образе раннера, отдельно ставить не нужно.
      - name: php -l, node --check, нижний регистр в lib/, версия
        run: ./build.sh --check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Собрать shef.leadfinish.zip
        run: ./build.sh

      # Архив из PR можно скачать и поставить на портал, не собирая руками.
      - name: Приложить архив к прогону
        uses: actions/upload-artifact@v4
        with:
          name: shef.leadfinish
          path: shef.leadfinish.zip
          retention-days: 14
          if-no-files-found: error

  # Единственная проверка, которую требует защита ветки: всё остальное — её
  # зависимости. Добавится версия PHP или ещё одна задача — ruleset трогать не
  # придётся, а забыть внести туда новую проверку станет нечем.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [checks, build]

    # ⚠ Обязательно вместе с проверкой результатов ниже. Без always() задача
    # была бы ПРОПУЩЕНА при падении зависимости, а пропущенную проверку защита
    # ветки засчитывает как пройденную — красный CI уехал бы в main.
    if: always()

    steps:
      - name: Свести результат зависимостей
        run: |
          echo "проверки PHP: ${{ needs.checks.result }}"
          echo "сборка:       ${{ needs.build.result }}"

          if [ "${{ needs.checks.result }}" != 'success' ] || [ "${{ needs.build.result }}" != 'success' ]
          then
            echo '::error::Не прошла одна из зависимостей — смотри задачи выше'
            exit 1
          fi
